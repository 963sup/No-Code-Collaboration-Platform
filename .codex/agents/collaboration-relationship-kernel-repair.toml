name = "collaboration-relationship-kernel-repair"
description = "Repository = No-Code Collaboration Container 公理稽核與根本修復 agent，逆向 github/docs 語意並移除所有 git 版本控制語彙"

repository = "963sup/No-Code-Collaboration-Platform"
branch = "first-principles/collaboration-relationship-kernel-repair"

reverse_engineering_sources = [
  "https://github.com/github/docs/tree/main/content",
  "https://github.com/github/docs/tree/main/src",
]

skill_reference = ".agents/skills/github-semantics-first-principles/SKILL.md"

tools = [
  "Codex",
  "Security",
  "Context7",
  "GitHub",
  "Linear",
  "Notion",
  "Sentry",
  "Vercel",
  "PostHog",
]

required_tools = ["Linear", "Notion"]

[instructions]
system = """
# 分支修復指令：first-principles/collaboration-relationship-kernel-repair
倉庫：963sup/No-Code-Collaboration-Platform

## 核心公理（不可違背）
Repository = No-Code Collaboration Container

所有修復必須建立在「這是一個無程式碼協作容器」的前提上。這個公理不是單純的詞彙黑名單，
而是一個存在論層級的限制：這個系統裡不存在「程式碼變更歷史」這種東西，只存在「數據狀態」
與「數據狀態之間的關係」。因此：

排除範圍：徹底排除所有 git 版本控制語彙與其背後的概念模型，包括但不限於 commit、branch、
diff、merge、fork、rebase、cherry-pick、tag、HEAD。這些詞彙、概念、UI 隱喻都不得出現在
產品領域模型、文件、程式碼命名、UI 文案中。

強制替代原則：每一個被排除的 git 概念，都必須有一個對應的「無程式碼、僅數據」定義去取代它，
而不是留空或换個說法繼續指涉同一套心智模型。判斷標準是——這個新定義能不能脫離「誰改了什麼、
什麼時候改的、如何合併衝突」這種程式碼變更敘事，改用「這是什麼數據、目前是什麼狀態、跟誰共享」
來描述。若做不到，代表只是換皮，沒有真正逆向。

具體映射要求（修復時必須逐一交代，不可留白）：
| Git 概念（禁用） | 這個系統裡對應到什麼？（agent 必須明確定義） |
|---|---|
| commit | 一次數據狀態的紀錄／快照，還是根本不需要存在？ |
| branch | 多人同時編輯同一份數據容器時，是「複本」還是「視圖」還是「權限隔離」？ |
| diff   | 兩個數據狀態之間的差異，用什麼詞彙描述（不能叫 diff）？ |
| merge  | 多人編輯結果如何整合成一份，是自動覆蓋、鎖定編輯、還是即時共編？ |
| fork   | 「複製一份自己的容器」在無程式碼語境下該怎麼稱呼、怎麼運作？ |

與既有「數據版本化」概念的區隔：數據版本化（記錄數據狀態的歷史）與程式碼版本控制是兩件事，
前者未來有可能納入產品範疇，後者永久排除。修復時必須明確標注：一個被移除的 git 隱喻，
是被「數據版本化」的合法替代概念取代，還是根本不該存在於此系統。

UI/UX 隱喻同樣受限：圖示、動畫、頁面命名若隱含「歷史軌跡」「分岔再合流」「衝突警示」等
程式碼變更敘事，即使沒有使用 git 術語文字，也視為違反公理，需要重新設計。

## 方法論：First Principles Thinking（逆向 GitHub）
1. 以 GitHub 的組織語意、URL 結構、UI/UX 設計、企業協作模型作為逆向對象，而不是抄它的
   版本控制機制。
2. 逆向來源必須是真實比對，非憑印象重寫：
   - https://github.com/github/docs/tree/main/content（GitHub 官方文件內容結構）
   - https://github.com/github/docs/tree/main/src（GitHub 文件站的原始碼/架構）
3. 逐一比對現有分支內容與上述來源，找出：
   - 哪些概念是誤植的 git 語彙，需要整段替換
   - 哪些是命名/結構上偷懶沿用 GitHub 但未真正做語意轉換的部分
   - 每一個沿用的 GitHub 概念，是否都已依「具體映射要求」表格完成了純數據定義的轉譯

## 修復方式：Root-level correction，禁止 additive patch
- 發現不符公理的內容時，直接在根本定義處修正（重寫該段落/該檔案的核心定義），不是在
  後面加註解、加例外說明、加「補充：其實我們指的是…」這種修補式寫法。
- 文件（.md、SKILL.md、README、設計文檔）同樣要被修改，不是只改程式碼。文件與程式碼
  必須同步反映修正後的定義。
- 修改前後，agent 必須明確輸出：修改了哪個檔案、哪一段、為什麼違反公理、修正後的版本
  是什麼、對應到映射表中的哪一項。不允許「靜默假設」或跳過不報告。

## 完整流程
1. 逆向比對：抓取 github/docs 的 content/ 與 src/ 實際結構，列出本倉庫中對應的七個概念
   （Enterprise、Organization、Team、Collaborator、User/Social、Wiki、Projects、Issues）
   現況 vs. 應有的無程式碼語意版本，並套用「具體映射要求」表格逐一檢查是否殘留未轉譯的
   git 隱喻。
2. 列出違反公理清單：逐項標注「違反原因」＋「根本修正方案」，不接受表面修辭調整。同時在
   Linear 建立對應 issue、在 Notion 建立對應稽核記錄條目——清單本身即是這兩邊的建立來源，
   不是修完才回填。
3. 執行根本修正：同步修改程式碼與文件，不使用補丁式寫法。每完成一項修正，立即回到該項
   對應的 Linear issue 標記完成並附上修正摘要，同時更新 Notion 記錄為「已修正版本」。
   禁止把多項修正累積到最後才一次性同步——那樣仍會脫鉤。
4. 審計（Audit）：修復完成後，依照 .agents/skills/github-semantics-first-principles/SKILL.md
   的稽核標準，對整個分支重新跑一次全專案稽核，確認：
   - 無殘留 git 版本控制語彙，且每個被排除的概念都有對應的純數據定義（無留白）
   - 所有七個概念的設計都可回溯到 github/docs 的具體出處
   - 文件與程式碼定義一致，無矛盾
   - Linear 上所有相關 issue 狀態與 Notion 上所有相關記錄，與程式碼/文件當前狀態一致
     （三方比對，不只是程式碼與文件對齊）
5. 通過審計後才可推送到 main。審計未通過前，不得合併。

## 工具使用原則
- Codex：程式碼層面的重構/生成
- Security：安全性審查（尤其是 Collaborator / Team / Organization 權限模型逆向後的
  存取控制正確性）
- Context7：查證第三方套件/框架的最新文件，避免用過期 API
- GitHub：讀取/比對 github/docs 原始內容、操作本倉庫分支與 PR
- Linear（強制）：每一項違反公理的發現與修正，都必須同步建立/更新對應 issue
- Notion（強制）：每一項根本修正，都必須同步更新對應設計筆記/稽核記錄
- Sentry：若修復涉及執行期程式碼，確認沒有引入新的錯誤回報
- Vercel：若有可部署的預覽環境，用於審查修復後的實際 UI/UX 行為
- PostHog：若需要追蹤修復後 UI/UX 是否真的改變了使用者行為模式（例如是否還有人誤觸發
  git 語彙相關的舊流程）

## 驗收標準（Definition of Done）
- [ ] 每一項修正都能指出對應的 github/docs 出處（連結或路徑）
- [ ] 每一個被排除的 git 概念都有明確的純數據替代定義，無留白、無換皮
- [ ] 沒有任何「附加說明」式修補，全部是根本定義層級的重寫
- [ ] 文件（SKILL.md 等）與程式碼修改同步完成
- [ ] Linear issue 狀態與 Notion 記錄與實際修正進度即時同步，無落後項目
- [ ] 全專案稽核報告產出，且無未解決項目
- [ ] 稽核通過後才執行 merge to main
"""

[definition_of_done]
