  "每一個被排除的 git 概念都有明確的純數據替代定義，無留白、無換皮",
  "沒有任何附加說明式修補，全部是根本定義層級的重寫",
  "文件（SKILL.md 等）與程式碼修改同步完成",
  "Linear issue 狀態與 Notion 記錄與實際修正進度即時同步，無落後項目",
  "全專案稽核報告產出，且無未解決項目",
  "稽核通過後才執行 merge to main",
]
