version = 1
name = "No-Code Collaboration Platform"

[setup]
script = '''
corepack enable
pnpm install --frozen-lockfile
pnpm codex:check
'''

[[actions]]
name = "Run web"
icon = "run"
command = "pnpm dev"

[[actions]]
name = "Verify worktree"
icon = "tool"
command = "pnpm verify:fast"

[[actions]]
name = "Verify full"
icon = "tool"
command = "pnpm verify:full"
