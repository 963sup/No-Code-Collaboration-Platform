name: Verify

on:
  push:
    branches:
      - main
      - 'first-principles/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Workflow guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          destination="${RUNNER_TEMP}/${archive}"
          curl --fail --location --silent --show-error \
            --output "${destination}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${destination}" | sha256sum --check -
          tar -xzf "${destination}" -C "${RUNNER_TEMP}" actionlint

      - name: Validate GitHub Actions
        run: |
          "${RUNNER_TEMP}/actionlint" -color

      - name: Analyze GitHub Actions security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: 'false'
          annotations: 'true'
          online-audits: 'false'
          persona: regular
          version: '1.29.0'

  typed-collaboration-repair:
    name: Typed collaboration and pgTAP repair
    if: github.event_name == 'push' && github.event.head_commit.message == 'Execute typed collaboration repair'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair typed boundaries and discriminating database fixtures
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(before)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one replacement target, found {count}: {before[:80]!r}')
              file.write_text(source.replace(before, after, 1))

          issue_command = 'packages/application/src/commands/execute-issue-command.ts'
          replace_once(
              issue_command,
              '''function needsAuthorState(command: IssueCommand): boolean {
  return command.type === 'edit' || command.type === 'close' || command.type === 'reopen';
}
''',
              '''type IssueCommandRequiringAuthorState = Extract<
  IssueCommand,
  { readonly type: 'edit' | 'close' | 'reopen' }
>;

function needsAuthorState(
  command: IssueCommand
): command is IssueCommandRequiringAuthorState {
  return command.type === 'edit' || command.type === 'close' || command.type === 'reopen';
}
'''
          )

          collaboration_commands = 'packages/application/tests/collaboration-commands.test.ts'
          replace_once(
              collaboration_commands,
              "import type { IssueDetail } from '@no-code-collaboration-platform/domain/resource';\n",
              "import type { RepositorySummary } from '@no-code-collaboration-platform/domain/repository';\nimport type { IssueDetail } from '@no-code-collaboration-platform/domain/resource';\n"
          )
          replace_once(
              collaboration_commands,
              'const privateRepository = {',
              'const privateRepository: RepositorySummary = {'
          )
          replace_once(
              collaboration_commands,
              'const publicRepository = {',
              'const publicRepository: RepositorySummary = {'
          )
          replace_once(
              collaboration_commands,
              'function repositoryReader(repository = privateRepository): RepositoryReader {',
              'function repositoryReader(repository: RepositorySummary = privateRepository): RepositoryReader {'
          )

          create_page = Path('packages/application/tests/create-page.test.ts')
          create_source = create_page.read_text()
          for before, after in (
              ("it('rejects a Viewer through the Domain capability decision'", "it('rejects Read through the Domain capability decision'"),
              ("directRole: 'viewer'", "directRole: 'read'"),
              ("it('creates a normalized blank Page for a Contributor'", "it('creates a normalized blank Page for Write'"),
              ("directRole: 'contributor'", "directRole: 'write'"),
          ):
              if before not in create_source:
                  raise RuntimeError(f'{create_page}: missing {before!r}')
              create_source = create_source.replace(before, after)
          create_page.write_text(create_source)

          update_page = Path('packages/application/tests/update-page.test.ts')
          update_source = update_page.read_text()
          for before, after in (
              ("it('rejects a Viewer before persistence'", "it('rejects Read before persistence'"),
              ("it('updates a Page for a Contributor with optimistic concurrency evidence'", "it('updates a Page for Write with optimistic concurrency evidence'"),
              ("directRole: 'viewer'", "directRole: 'read'"),
              ("directRole: 'contributor'", "directRole: 'write'"),
          ):
              if before not in update_source:
                  raise RuntimeError(f'{update_page}: missing {before!r}')
              update_source = update_source.replace(before, after)
          update_page.write_text(update_source)

          issue_queries = 'packages/application/tests/issue-queries.test.ts'
          replace_once(
              issue_queries,
              '''    const reader: IssueReader = {
      findAccessibleIssue,
      async listAccessibleIssues() {
''',
              '''    const reader: IssueReader = {
      findAccessibleIssue,
      async findAccessibleIssueById() {
        return null;
      },
      async listAccessibleIssues() {
'''
          )
          replace_once(
              issue_queries,
              '''    const reader: IssueReader = {
      async findAccessibleIssue() {
        return null;
      },
      listAccessibleIssues
''',
              '''    const reader: IssueReader = {
      async findAccessibleIssue() {
        return null;
      },
      async findAccessibleIssueById() {
        return null;
      },
      listAccessibleIssues
'''
          )

          collaboration_sql = 'supabase/tests/collaboration-lifecycle.test.sql'
          replace_once(
              collaboration_sql,
              '''update public.profiles set username = 'collaboration-owner'
where id = '00000000-0000-0000-0000-000000000501';

insert into public.repositories (
  id,
  owner_user_id,
  slug,
  name,
  visibility,
  created_by
)
values
  (
    '20000000-0000-0000-0000-000000000501',
    '00000000-0000-0000-0000-000000000501',
    'private-collaboration',
    'Private Collaboration',
    'private',
    '00000000-0000-0000-0000-000000000501'
  ),
  (
    '20000000-0000-0000-0000-000000000502',
    '00000000-0000-0000-0000-000000000501',
    'public-collaboration',
    'Public Collaboration',
    'public',
    '00000000-0000-0000-0000-000000000501'
  );
''',
              '''update public.profiles set username = 'collaboration-owner'
where id = '00000000-0000-0000-0000-000000000501';

insert into public.organizations (id, slug, name, created_by)
values (
  '10000000-0000-0000-0000-000000000501',
  'collaboration-organization',
  'Collaboration Organization',
  '00000000-0000-0000-0000-000000000501'
);

insert into public.repositories (
  id,
  owner_organization_id,
  slug,
  name,
  visibility,
  created_by
)
values
  (
    '20000000-0000-0000-0000-000000000501',
    '10000000-0000-0000-0000-000000000501',
    'private-collaboration',
    'Private Collaboration',
    'private',
    '00000000-0000-0000-0000-000000000501'
  ),
  (
    '20000000-0000-0000-0000-000000000502',
    '10000000-0000-0000-0000-000000000501',
    'public-collaboration',
    'Public Collaboration',
    'public',
    '00000000-0000-0000-0000-000000000501'
  );
'''
          )
          replace_once(
              collaboration_sql,
              '''select is(
  (select count(*) from public.list_notifications('all', 1)),
  0::bigint,
  'the triggering Actor never receives a self-notification'
);
''',
              '''select is(
  (
    select count(*)
    from public.notification_threads as notification
    join public.activity_events as evidence
      on evidence.id = notification.source_evidence_id
    where notification.recipient_id = (select auth.uid())
      and evidence.actor_id = (select auth.uid())
  ),
  0::bigint,
  'the triggering Actor never receives a self-notification'
);
'''
          )

          replace_once(
              'supabase/tests/page-resource.test.sql',
              "    'resource.create'\n",
              "    'page.create'\n"
          )
          PY

          pnpm exec oxfmt \
            packages/application/src/commands/execute-issue-command.ts \
            packages/application/tests/collaboration-commands.test.ts \
            packages/application/tests/create-page.test.ts \
            packages/application/tests/update-page.test.ts \
            packages/application/tests/issue-queries.test.ts
          pnpm typecheck

      - name: Start minimal local Supabase stack
        run: pnpm supabase:start:ci

      - name: Verify repaired database contracts
        run: pnpm supabase:verify

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop

      - name: Commit typed collaboration repair
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            packages/application/src/commands/execute-issue-command.ts \
            packages/application/tests/collaboration-commands.test.ts \
            packages/application/tests/create-page.test.ts \
            packages/application/tests/update-page.test.ts \
            packages/application/tests/issue-queries.test.ts \
            supabase/tests/collaboration-lifecycle.test.sql \
            supabase/tests/page-resource.test.sql
          git diff --cached --check
          git commit -m 'Repair typed collaboration contracts'
          git push origin "HEAD:${TARGET_BRANCH}"

  repository:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Sentry Actions secret
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SENTRY_AUTH_TOKEN_CONFIGURED: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          test "${SENTRY_AUTH_TOKEN_CONFIGURED}" = 'true' || { echo 'SENTRY_AUTH_TOKEN is not configured'; exit 1; }

      - name: Verify repository
        env:
          SENTRY_ENVIRONMENT: ci
        run: pnpm verify:full

  database:
    name: Supabase contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start minimal local Supabase stack
        run: pnpm supabase:start:ci

      - name: Verify database
        run: pnpm supabase:verify

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop

  browser:
    name: Browser contracts
    needs: [repository, database]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start browser Supabase stack with Mailpit
        run: pnpm supabase:start:browser

      - name: Export local Supabase environment
        run: pnpm supabase:env:github

      - name: Build web application
        env:
          SENTRY_ENVIRONMENT: ci
        run: pnpm build

      - name: Install Chromium
        run: pnpm browser:install:ci

      - name: Verify browser behavior
        run: pnpm test:e2e

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop
