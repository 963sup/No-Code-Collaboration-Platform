name: Verify

on:
  push:
    branches:
      - main
      - 'first-principles/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Workflow guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          destination="${RUNNER_TEMP}/${archive}"
          curl --fail --location --silent --show-error \
            --output "${destination}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${destination}" | sha256sum --check -
          tar -xzf "${destination}" -C "${RUNNER_TEMP}" actionlint

      - name: Validate GitHub Actions
        run: |
          "${RUNNER_TEMP}/actionlint" -color

      - name: Analyze GitHub Actions security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: 'false'
          annotations: 'true'
          online-audits: 'false'
          persona: regular
          version: '1.29.0'

      - name: Upload short-lived source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-${{ github.sha }}
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1

  root-repair:
    name: Root semantic and replay repair
    if: github.event_name == 'push' && github.event.head_commit.message == 'Execute root semantic and baseline repair'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Apply root correction and rebuild replay baseline
        run: |
          set -euo pipefail
          node <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          function replaceExactlyOnce(path, before, after) {
            const source = readFileSync(path, 'utf8');
            const count = source.split(before).length - 1;
            if (count !== 1) {
              throw new Error(`${path}: expected one replacement target, found ${count}`);
            }
            writeFileSync(path, source.replace(before, after), 'utf8');
          }

          replaceExactlyOnce(
            'docs/domains/access-authority.md',
            'Capability is the decision truth. Role rank may explain nested bundles but does not authorize delegation.',
            'Capability is the decision truth. Direct Repository access management is Admin-only. Role rank never grants delegation authority.'
          );

          replaceExactlyOnce(
            'supabase/schemas/30_repository.sql',
            'No-code collaboration containers and the primary Resource/authorization/history boundary; each Repository is owned by exactly one User or Organization.',
            'No-code collaboration containers and the primary Resource/authorization/Evidence boundary; each Repository is owned by exactly one User or Organization.'
          );

          const workflowPath = '.github/workflows/verify.yml';
          let workflow = readFileSync(workflowPath, 'utf8');
          const repairStart = workflow.indexOf('\n  root-repair:\n');
          const repositoryStart = workflow.indexOf('\n  repository:\n', repairStart);
          if (repairStart < 0 || repositoryStart < 0) {
            throw new Error('Temporary root-repair job boundary is unavailable.');
          }
          workflow = workflow.slice(0, repairStart) + workflow.slice(repositoryStart);

          const uploadStart = workflow.indexOf('\n      - name: Upload short-lived source snapshot\n');
          const repositoryAfterUpload = workflow.indexOf('\n  repository:\n', uploadStart);
          if (uploadStart < 0 || repositoryAfterUpload < 0) {
            throw new Error('Temporary source-snapshot step boundary is unavailable.');
          }
          workflow = workflow.slice(0, uploadStart) + '\n' + workflow.slice(repositoryAfterUpload);
          writeFileSync(workflowPath, workflow, 'utf8');
          NODE

          node tooling/compile-local-supabase-baseline.mjs
          node tooling/check-codex-contract.mjs
          node tooling/check-github-semantic-contract.mjs
          node tooling/check-operational-contract.mjs
          node tooling/check-documentation-contracts-current.mjs
          node tooling/check-instruction-scopes.mjs

      - name: Commit root repair
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/verify.yml \
            docs/domains/access-authority.md \
            supabase/schemas/30_repository.sql \
            supabase/migrations/20260814190012_local_development_baseline.sql
          git diff --cached --check
          git commit -m 'Repair executable authority and replay baseline'
          git push origin "HEAD:${TARGET_BRANCH}"

  repository:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Sentry Actions secret
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SENTRY_AUTH_TOKEN_CONFIGURED: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          test "${SENTRY_AUTH_TOKEN_CONFIGURED}" = 'true' || { echo 'SENTRY_AUTH_TOKEN is not configured'; exit 1; }

      - name: Verify repository
        env:
          SENTRY_ENVIRONMENT: ci
        run: pnpm verify:full

  database:
    name: Supabase contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start minimal local Supabase stack
        run: pnpm supabase:start:ci

      - name: Verify database
        run: pnpm supabase:verify

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop

  browser:
    name: Browser contracts
    needs: [repository, database]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start browser Supabase stack with Mailpit
        run: pnpm supabase:start:browser

      - name: Export local Supabase environment
        run: pnpm supabase:env:github

      - name: Build web application
        env:
          SENTRY_ENVIRONMENT: ci
        run: pnpm build

      - name: Install Chromium
        run: pnpm browser:install:ci

      - name: Verify browser behavior
        run: pnpm test:e2e

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop
