name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Workflow guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          destination="${RUNNER_TEMP}/${archive}"
          curl --fail --location --silent --show-error \
            --output "${destination}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${destination}" | sha256sum --check -
          tar -xzf "${destination}" -C "${RUNNER_TEMP}" actionlint

      - name: Validate GitHub Actions
        run: |
          "${RUNNER_TEMP}/actionlint" -color

      - name: Analyze GitHub Actions security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: 'false'
          annotations: 'true'
          online-audits: 'false'
          persona: regular
          version: '1.29.0'

  repository:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Export generated lockfile
        run: |
          echo 'PNPM_LOCK_GZIP_BASE64_BEGIN'
          gzip -9 -c pnpm-lock.yaml | base64
          echo 'PNPM_LOCK_GZIP_BASE64_END'

      - name: Verify repository
        run: pnpm verify:full

  database:
    name: Supabase contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Start minimal local Supabase stack
        run: pnpm supabase:start:ci

      - name: Verify database
        run: pnpm supabase:verify

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop

  browser:
    name: Browser contracts
    needs: [repository, database]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Start browser Supabase stack with Mailpit
        run: pnpm supabase:start:browser

      - name: Export local Supabase environment
        run: pnpm supabase:env:github

      - name: Build web application
        run: pnpm build

      - name: Install Chromium
        run: pnpm browser:install:ci

      - name: Verify browser behavior
        run: pnpm test:e2e

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop
