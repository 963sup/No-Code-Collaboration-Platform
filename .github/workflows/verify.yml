name: Verify

on:
  push:
    branches:
      - main
      - 'first-principles/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Workflow guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          destination="${RUNNER_TEMP}/${archive}"
          curl --fail --location --silent --show-error \
            --output "${destination}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${destination}" | sha256sum --check -
          tar -xzf "${destination}" -C "${RUNNER_TEMP}" actionlint

      - name: Validate GitHub Actions
        run: |
          "${RUNNER_TEMP}/actionlint" -color

      - name: Analyze GitHub Actions security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: 'false'
          annotations: 'true'
          online-audits: 'false'
          persona: regular
          version: '1.29.0'

  contract-repair:
    name: Discriminating authority contract repair
    if: github.event_name == 'push' && github.event.head_commit.message == 'Execute discriminating authority tests'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Add current-truth benchmark and executable evidence
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(before)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one replacement target, found {count}')
              file.write_text(source.replace(before, after, 1))

          access = 'docs/domains/access-authority.md'
          replace_once(
              access,
              'Current persisted Principal support is User only. Team and App remain deferred until a real workflow proves durable group or machine authority.\n\n',
              '''Current persisted Principal support is User only. Team and App remain deferred until a real workflow proves durable group or machine authority.\n\n## GitHub benchmark evidence boundary\n\n```text\ngithub/docs/content\n= GitHub product-documentation source used as Product-semantics evidence\n\ngithub/docs/src\n= docs.github.com content-loading, rendering, and testing implementation evidence\n≠ GitHub.com Product source code\n```\n\nThe benchmark may establish observable GitHub Product behavior. It never authorizes importing Code, Git, Branch, Pull Request, Actions, Release, or docs-site implementation architecture into this Product.\n\n'''
          )
          replace_once(
              access,
              '5. Expected current Role is a real compare-and-swap precondition; stale state changes nothing and emits no success Evidence.\n',
              '5. Expected current Role is a real compare-and-swap precondition; stale state returns `state-changed`, changes nothing, and emits no success Evidence.\n'
          )

          role_test = 'supabase/tests/role-delegation.test.sql'
          replace_once(role_test, 'select plan(19);', 'select plan(20);')
          replace_once(
              role_test,
              '''insert into public.repositories (id, owner_organization_id, slug, name, created_by)\nvalues (\n  '20000000-0000-0000-0000-000000000101',\n  '10000000-0000-0000-0000-000000000101',\n  'delegation-repository',\n  'Delegation Repository',\n  '00000000-0000-0000-0000-000000000101'\n);\n''',
              '''insert into public.repositories (id, owner_organization_id, slug, name, created_by)\nvalues (\n  '20000000-0000-0000-0000-000000000101',\n  '10000000-0000-0000-0000-000000000101',\n  'delegation-repository',\n  'Delegation Repository',\n  '00000000-0000-0000-0000-000000000101'\n);\n\ninsert into public.repositories (id, owner_user_id, slug, name, created_by)\nvalues (\n  '20000000-0000-0000-0000-000000000102',\n  '00000000-0000-0000-0000-000000000101',\n  'personal-delegation',\n  'Personal Delegation',\n  '00000000-0000-0000-0000-000000000101'\n);\n'''
          )
          replace_once(
              role_test,
              '''select is(\n  public.execute_repository_grant_command(\n    '20000000-0000-0000-0000-000000000101',\n    '00000000-0000-0000-0000-000000000109',\n    null,\n    'admin'\n  ),\n  'applied',\n  'Repository Admin can create an Admin Direct Grant'\n);\n\nselect * from finish();\n''',
              '''select is(\n  public.execute_repository_grant_command(\n    '20000000-0000-0000-0000-000000000101',\n    '00000000-0000-0000-0000-000000000109',\n    null,\n    'admin'\n  ),\n  'applied',\n  'Repository Admin can create an Admin Direct Grant'\n);\n\nselect is(\n  public.execute_repository_grant_command(\n    '20000000-0000-0000-0000-000000000102',\n    '00000000-0000-0000-0000-000000000108',\n    null,\n    'read'\n  ),\n  'forbidden',\n  'personal Repository rejects a Read Direct Grant'\n);\n\nselect * from finish();\n'''
          )

          collaboration_test = 'supabase/tests/collaboration-lifecycle.test.sql'
          replace_once(collaboration_test, 'select plan(57);', 'select plan(59);')
          replace_once(
              collaboration_test,
              '''select set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-000000000503', true);\n\nselect is(\n  (select max(total_count) from public.search_collaboration('shared', 'issue', '', '', '', 'relevance', 1)),\n''',
              '''select set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-000000000503', true);\n\nselect results_eq(\n  $$\n    select issue_number from public.create_issue(\n      '20000000-0000-0000-0000-000000000502',\n      'Public participant Issue',\n      'Created without a Direct Grant'\n    )\n  $$,\n  $$ values (2::bigint) $$,\n  'public authenticated Actor can create an Issue without a Direct Grant'\n);\n\nselect results_eq(\n  $$\n    select version from public.edit_issue(\n      '20000000-0000-0000-0000-000000000502',\n      (select id from public.issues where repository_id = '20000000-0000-0000-0000-000000000502' and issue_number = 2),\n      'Public participant Issue updated',\n      'Author-owned update',\n      1\n    )\n  $$,\n  $$ values (2::bigint) $$,\n  'Issue author can edit their own Issue without Triage or Write'\n);\n\nselect is(\n  (select max(total_count) from public.search_collaboration('shared', 'issue', '', '', '', 'relevance', 1)),\n'''
          )
          PY

          node tooling/check-access-authority.mjs
          node tooling/check-documentation-contracts-current.mjs
          node tooling/check-github-semantic-contract.mjs

      - name: Commit contract repair
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docs/domains/access-authority.md \
            supabase/tests/role-delegation.test.sql \
            supabase/tests/collaboration-lifecycle.test.sql
          git diff --cached --check
          git commit -m 'Add discriminating authority evidence'
          git push origin "HEAD:${TARGET_BRANCH}"

  repository:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Sentry Actions secret
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SENTRY_AUTH_TOKEN_CONFIGURED: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          test "${SENTRY_AUTH_TOKEN_CONFIGURED}" = 'true' || { echo 'SENTRY_AUTH_TOKEN is not configured'; exit 1; }

      - name: Verify repository
        env:
          SENTRY_ENVIRONMENT: ci
        run: pnpm verify:full

  database:
    name: Supabase contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start minimal local Supabase stack
        run: pnpm supabase:start:ci

      - name: Verify database
        run: pnpm supabase:verify

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop

  browser:
    name: Browser contracts
    needs: [repository, database]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start browser Supabase stack with Mailpit
        run: pnpm supabase:start:browser

      - name: Export local Supabase environment
        run: pnpm supabase:env:github

      - name: Build web application
        env:
          SENTRY_ENVIRONMENT: ci
        run: pnpm build

      - name: Install Chromium
        run: pnpm browser:install:ci

      - name: Verify browser behavior
        run: pnpm test:e2e

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop
