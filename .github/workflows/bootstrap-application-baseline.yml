name: Bootstrap application baseline

on:
  push:
    branches:
      - feat/first-principles-application-baseline

permissions:
  contents: write

concurrency:
  group: bootstrap-application-baseline
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/first-principles-application-baseline

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install existing dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Resolve current application dependencies
        run: |
          pnpm --filter @no-code-collaboration-platform/web add --save-exact next@latest react@latest react-dom@latest lucide-react@latest zod@latest
          pnpm --filter @no-code-collaboration-platform/web add --save-dev --save-exact @tailwindcss/postcss@latest tailwindcss@latest @types/react@latest @types/react-dom@latest
          pnpm --filter @no-code-collaboration-platform/supabase add --save-exact @supabase/supabase-js@latest @supabase/ssr@latest
          pnpm --filter @no-code-collaboration-platform/ui add --save-exact class-variance-authority@latest clsx@latest tailwind-merge@latest
          pnpm --filter @no-code-collaboration-platform/ui add --save-dev --save-exact @types/react@latest
          pnpm add --workspace-root --save-dev --save-exact vitest@latest shadcn@latest

      - name: Update generated-type references
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              'AGENTS.md',
              'docs/DEVELOPMENT_ENVIRONMENT.md',
              'supabase/AGENTS.md',
              'supabase/schemas/README.md',
          ]:
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text()
              text = text.replace('types/database.types.ts', 'packages/supabase/src/generated/database.types.ts')
              path.write_text(text)
          PY

      - name: Start local Supabase
        run: pnpm supabase:start

      - name: Generate initial migration
        run: |
          if [ -z "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print -quit 2>/dev/null)" ]; then
            pnpm exec supabase db diff -f initial_collaboration_core
          fi

      - name: Rebuild database and generate types
        run: |
          pnpm supabase:reset
          pnpm supabase:types:local

      - name: Format source
        run: pnpm format

      - name: Verify implementation
        run: |
          pnpm supabase:lint
          pnpm supabase:test
          pnpm supabase:types:check
          pnpm verify:full

      - name: Commit resolved baseline
        run: |
          git add -- \
            AGENTS.md \
            apps/web \
            docs/DEVELOPMENT_ENVIRONMENT.md \
            package.json \
            packages/application \
            packages/domain \
            packages/supabase \
            packages/ui \
            pnpm-lock.yaml \
            supabase/AGENTS.md \
            supabase/migrations \
            supabase/schemas \
            supabase/tests \
            turbo.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: resolve application baseline artifacts"
          git push origin HEAD:feat/first-principles-application-baseline

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop
