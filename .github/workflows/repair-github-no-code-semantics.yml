name: Repair GitHub no-code semantics

on:
  push:
    branches:
      - first-principles/collaboration-relationship-kernel-repair

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[repair-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic repair
        run: node tooling/repair-github-no-code-semantics-v2.mjs

      - name: Format source projections
        run: pnpm format

      - name: Compile LocalOnly baseline
        run: pnpm supabase:baseline:compile

      - name: Start local Supabase
        run: pnpm supabase:start:ci

      - name: Replay desired database state
        run: pnpm supabase:reset

      - name: Regenerate database types
        run: pnpm supabase:types:local

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop

      - name: Commit generated repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            apps/web/e2e/repository-grant-lifecycle.spec.ts \
            apps/web/src/app/'(owner)'/'[ownerSlug]'/'[repositorySlug]'/discussions/page.tsx \
            packages/application/tests/can-read-repository-activity.test.ts \
            packages/application/tests/collaboration-commands.test.ts \
            packages/application/tests/explain-current-repository-access.test.ts \
            packages/domain/tests/authority.test.ts \
            packages/infrastructure/supabase/src/generated/database.types.ts \
            supabase/migrations/20260814190012_local_development_baseline.sql \
            supabase/schemas/93_collaboration_commands.sql \
            supabase/schemas/99_rls.sql \
            supabase/tests/authorization.test.sql \
            supabase/tests/collaboration-lifecycle.test.sql \
            supabase/tests/issue-read-projection.test.sql \
            supabase/tests/page-resource.test.sql \
            supabase/tests/repository-grant-lifecycle.test.sql \
            supabase/tests/repository-owner-authority.test.sql \
            supabase/tests/role-delegation.test.sql
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'chore(repair): generate semantic projections [repair-generated]'
          git push origin HEAD:first-principles/collaboration-relationship-kernel-repair
