name: Format boundary refactor

on:
  push:
    branches:
      - refactor/nextjs-supabase-boundaries

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: refactor/nextjs-supabase-boundaries

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed source
        run: pnpm exec oxfmt --write apps/web/src/composition/refresh-session.ts

      - name: Commit formatter output when changed
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/composition/refresh-session.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/composition/refresh-session.ts
          git commit -m "style: apply oxfmt to session composition"
          git push origin HEAD:refactor/nextjs-supabase-boundaries
