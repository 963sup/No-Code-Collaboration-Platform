name: Typed Collaboration Repair

on:
  push:
    branches:
      - 'first-principles/collaboration-relationship-kernel-repair'

permissions:
  contents: read

jobs:
  repair:
    if: github.event.head_commit.message == 'Execute typed collaboration repair v2'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic repair
        run: echo '' | base64 --decode | python

      - name: Format and typecheck
        run: |
          pnpm exec oxfmt \
            packages/application/src/commands/execute-issue-command.ts \
            packages/application/tests/collaboration-commands.test.ts \
            packages/application/tests/create-page.test.ts \
            packages/application/tests/update-page.test.ts \
            packages/application/tests/issue-queries.test.ts
          pnpm typecheck

      - name: Start minimal local Supabase stack
        run: pnpm supabase:start:ci

      - name: Verify database contracts
        run: pnpm supabase:verify

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop

      - name: Commit repair
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            packages/application/src/commands/execute-issue-command.ts \
            packages/application/tests/collaboration-commands.test.ts \
            packages/application/tests/create-page.test.ts \
            packages/application/tests/update-page.test.ts \
            packages/application/tests/issue-queries.test.ts \
            supabase/tests/collaboration-lifecycle.test.sql \
            supabase/tests/page-resource.test.sql
          git diff --cached --check
          git commit -m 'Repair typed collaboration contracts'
          git push origin "HEAD:${TARGET_BRANCH}"
