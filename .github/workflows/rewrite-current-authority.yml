name: Rewrite current authority truth

on:
  push:
    branches:
      - first-principles/collaboration-relationship-kernel-repair

permissions:
  contents: write

jobs:
  rewrite:
    if: ${{ !contains(github.event.head_commit.message, '[truth-rewritten]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rewrite current truth sections
        run: node tooling/rewrite-current-authority-sections.mjs

      - name: Format rewritten projections
        run: pnpm format

      - name: Commit rewritten truth
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            docs/ONTOLOGY.md \
            supabase/tests/collaboration-lifecycle.test.sql \
            tooling/check-instruction-scopes.mjs
          git commit -m 'docs: rewrite current authority truth [truth-rewritten]'
          git push origin HEAD:first-principles/collaboration-relationship-kernel-repair
