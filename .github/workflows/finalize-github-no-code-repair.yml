name: Finalize GitHub no-code repair

on:
  push:
    branches:
      - first-principles/collaboration-relationship-kernel-repair

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[repair-finalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize remaining semantic projections
        run: node tooling/finalize-github-no-code-repair.mjs

      - name: Format source truth
        run: pnpm format

      - name: Compile LocalOnly baseline
        run: pnpm supabase:baseline:compile

      - name: Start local Supabase
        run: pnpm supabase:start:ci

      - name: Replay and verify database
        run: |
          set -euo pipefail
          pnpm supabase:reset
          pnpm supabase:lint
          pnpm supabase:test
          pnpm supabase:types:local
          pnpm supabase:types:check

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop

      - name: Remove transient repair tooling
        run: |
          rm -f \
            tooling/repair-github-no-code-semantics.mjs \
            tooling/repair-github-no-code-semantics-v2.mjs \
            tooling/rewrite-current-authority-sections.mjs \
            tooling/finalize-github-no-code-repair.mjs \
            .github/workflows/finalize-github-no-code-repair.yml

      - name: Verify final clean tree
        run: pnpm verify:fast

      - name: Commit clean repair tree
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git diff --name-only -z | xargs -0 git add --
          git diff --cached --check
          git commit -m 'refactor(access): finalize GitHub no-code authority semantics [repair-finalized]'
          git push origin HEAD:first-principles/collaboration-relationship-kernel-repair
